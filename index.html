<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bom9</title>
  <style>
    :root { --bg:#f6f8f5; --text:#1f2a24; --accent:#2f7d5b; }
    * { box-sizing:border-box; margin:0; }
    body { font-family:-apple-system, "Pretendard", "Noto Sans KR", sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:grid; place-items:center; padding:24px; }
    main { max-width:560px; text-align:center; }
    h1 { font-size:2.4rem; margin-bottom:12px; }
    p { line-height:1.6; opacity:.8; }
    .badge { display:inline-block; margin-top:24px; padding:8px 16px; border-radius:999px; background:var(--accent); color:#fff; font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>bom9</h1>
    <p>GitHub Pages 배포가 완료되었습니다.<br>이 페이지를 Claude Code로 만든 사이트로 교체하면 됩니다.</p>
    <span class="badge">Hello, world 🌱</span>
  </main>
</body>
</html>
